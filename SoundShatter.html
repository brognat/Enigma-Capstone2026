<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Shatter - The Enigma Escape Room</title>
    <link rel="stylesheet" href="Style.css" />
    <link rel="stylesheet" href="Game.css" />
    <style>
      #game-root canvas {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="game-page">
    <main id="game-root" aria-label="Sound Shatter">
      <header class="room-toolbar">
        <h1>Sound Shatter</h1>
        <nav aria-label="Game controls">
          <a href="Index.html">Exit</a>
          <a class="finish-room button" href="Complete.html">Finish room</a>
        </nav>
      </header>
    </main>
    <button
      class="robot-face robot-face--full"
      id="robot-chat-toggle"
      type="button"
      aria-label="Open game guide chat"
      aria-controls="robot-chat"
      aria-expanded="false"
      data-ai-mode="full"
      hidden
    >
      <span class="antenna left"></span>
      <span class="antenna right"></span>
      <span class="top-piece"></span>

      <span class="ear left"></span>
      <span class="ear right"></span>

      <span class="head"></span>

      <span class="eye left"><span class="pupil"></span></span>
      <span class="eye right"><span class="pupil"></span></span>

      <span class="mouth">
        <span class="tooth"></span>
        <span class="tooth"></span>
        <span class="tooth"></span>
        <span class="tooth"></span>
        <span class="tooth"></span>
      </span>
    </button>
    <button
      class="robot-face robot-face--collaborative"
      id="collaborative-robot-chat-toggle"
      type="button"
      aria-label="Open collaborative game guide chat"
      aria-controls="collaborative-robot-chat"
      aria-expanded="false"
      data-ai-mode="collaborative"
      hidden
    >
      <span class="antenna left"></span>
      <span class="antenna right"></span>
      <span class="top-piece"></span>

      <span class="ear left"></span>
      <span class="ear right"></span>

      <span class="head"></span>

      <span class="eye left"><span class="pupil"></span></span>
      <span class="eye right"><span class="pupil"></span></span>

      <span class="mouth">
        <span class="tooth"></span>
        <span class="tooth"></span>
        <span class="tooth"></span>
        <span class="tooth"></span>
        <span class="tooth"></span>
      </span>
    </button>
    <section
      class="robot-chat"
      id="robot-chat"
      data-ai-mode="full"
      role="dialog"
      aria-labelledby="robot-chat-title"
      aria-describedby="robot-chat-message"
      tabindex="-1"
      hidden
    >
      <header class="robot-chat-header">
        <h2 id="robot-chat-title">Game Guide</h2>
        <button
          class="robot-chat-close"
          id="robot-chat-close"
          type="button"
          aria-label="Close chat"
        >
          &times;
        </button>
      </header>
      <p class="robot-chat-message" id="robot-chat-message">
        Hi! I'm your A.I. game assistant, here to help you escape!
      </p>
      <label class="robot-chat-label" for="robot-chat-input"
        >Your message</label
      >
      <div class="robot-chat-composer">
        <textarea
          id="robot-chat-input"
          class="robot-chat-input"
          rows="2"
          placeholder="Type a message..."
          aria-describedby="robot-chat-note"
        ></textarea>
        <button type="button" disabled>Send</button>
      </div>
      <p class="robot-chat-note" id="robot-chat-note">
        Preview only. Messages are not sent.
      </p>
    </section>
    <section
      class="robot-chat"
      id="collaborative-robot-chat"
      data-ai-mode="collaborative"
      role="dialog"
      aria-labelledby="collaborative-robot-chat-title"
      aria-describedby="collaborative-robot-chat-message"
      tabindex="-1"
      hidden
    >
      <header class="robot-chat-header">
        <h2 id="collaborative-robot-chat-title">Collaborative Game Guide</h2>
        <button class="robot-chat-close" type="button" aria-label="Close chat">
          &times;
        </button>
      </header>
      <p class="robot-chat-message" id="collaborative-robot-chat-message">
        Hi! I'm your A.I. collaborator, here to help you and your team escape!
      </p>
      <label class="robot-chat-label" for="collaborative-robot-chat-input">
        Your message
      </label>
      <div class="robot-chat-composer">
        <textarea
          id="collaborative-robot-chat-input"
          class="robot-chat-input"
          rows="2"
          placeholder="Type a message..."
          aria-describedby="collaborative-robot-chat-note"
        ></textarea>
        <button type="button" disabled>Send</button>
      </div>
      <p class="robot-chat-note" id="collaborative-robot-chat-note">
        Preview only. Messages are not sent.
      </p>
    </section>
    <script src="Assistant.js"></script>
    <script type="module">
      import * as THREE from "three";

      const ROOM_W = 20,
        ROOM_D = 16,
        WALL_H = 5;
      const HALL_W = 4,
        HALL_H = 4,
        HALL_LEN = 14;
      const TILE_W = 2.5; // world width of one stone texture tile
      const BACK_Z = -ROOM_D / 2;

      const root = document.getElementById("game-root");
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(root.clientWidth, root.clientHeight);
      root.prepend(renderer.domElement);
      renderer.domElement.setAttribute("role", "img");
      renderer.domElement.setAttribute(
        "aria-label",
        "3D stone room with an upward-facing central speaker wired to frequency and amplitude displays with decorative knobs, and a glass pane at the hallway entrance",
      );

      const scene = new THREE.Scene();

      // Fixed camera at the front of the room, tilted slightly downward.
      const camera = new THREE.PerspectiveCamera(
        55,
        root.clientWidth / root.clientHeight,
        0.1,
        200,
      );
      camera.position.set(0, 11, ROOM_D / 2 + 9);
      camera.lookAt(0, 0, -2);

      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(6, 14, 10);
      scene.add(sun);
      for (const x of [-2.75, 2.75]) {
        const roomLight = new THREE.PointLight(0xffdfb5, 32, 9);
        roomLight.position.set(x, 3.6, 0);
        scene.add(roomLight);
      }
      const hallLight = new THREE.PointLight(0xffcc88, 30, 20);
      hallLight.position.set(0, 3, BACK_Z - HALL_LEN + 2);
      scene.add(hallLight);

      const stoneSurfaces = [];
      function stoneMaterial(width, height, type = "wall") {
        const material = new THREE.MeshStandardMaterial({
          color: 0x555555,
          roughness: 0.9,
          side: THREE.DoubleSide,
        });
        stoneSurfaces.push({ material, width, height, type });
        return material;
      }

      function plane(w, h, pos, rotY = 0, rotX = 0, type = "wall") {
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          stoneMaterial(w, h, type),
        );
        mesh.position.copy(pos);
        mesh.rotation.set(rotX, rotY, 0);
        scene.add(mesh);
      }
      const v = (x, y, z) => new THREE.Vector3(x, y, z);

      // Room floor and walls (front wall omitted so the camera can see in).
      plane(ROOM_W, ROOM_D, v(0, 0, 0), 0, -Math.PI / 2, "floor");
      plane(ROOM_D, WALL_H, v(-ROOM_W / 2, WALL_H / 2, 0), Math.PI / 2);
      plane(ROOM_D, WALL_H, v(ROOM_W / 2, WALL_H / 2, 0), -Math.PI / 2);

      // Back wall split around the hallway opening.
      const sideW = (ROOM_W - HALL_W) / 2;
      plane(sideW, WALL_H, v(-(HALL_W / 2 + sideW / 2), WALL_H / 2, BACK_Z));
      plane(sideW, WALL_H, v(HALL_W / 2 + sideW / 2, WALL_H / 2, BACK_Z));
      plane(
        HALL_W,
        WALL_H - HALL_H,
        v(0, HALL_H + (WALL_H - HALL_H) / 2, BACK_Z),
      );

      // The hallway has no ceiling so the camera can see inside.
      const hallMidZ = BACK_Z - HALL_LEN / 2;
      plane(HALL_W, HALL_LEN, v(0, 0, hallMidZ), 0, -Math.PI / 2, "floor");
      plane(
        HALL_LEN,
        HALL_H,
        v(-HALL_W / 2, HALL_H / 2, hallMidZ),
        Math.PI / 2,
      );
      plane(
        HALL_LEN,
        HALL_H,
        v(HALL_W / 2, HALL_H / 2, hallMidZ),
        -Math.PI / 2,
      );
      plane(HALL_W, HALL_H, v(0, HALL_H / 2, BACK_Z - HALL_LEN));

      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xa8eaff,
        transparent: true,
        opacity: 0.24,
        roughness: 0.08,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const glassPane = new THREE.Mesh(
        new THREE.PlaneGeometry(HALL_W, HALL_H),
        glassMaterial,
      );
      glassPane.position.set(0, HALL_H / 2, BACK_Z - 0.12);
      scene.add(glassPane);

      const speakerBodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x252a30,
        metalness: 0.55,
        roughness: 0.4,
      });
      const speakerConeMaterial = new THREE.MeshStandardMaterial({
        color: 0x68717a,
        metalness: 0.25,
        roughness: 0.65,
        side: THREE.DoubleSide,
      });
      const speakerBody = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.3, 1.8),
        speakerBodyMaterial,
      );
      speakerBody.position.set(0, 0.15, 0);
      scene.add(speakerBody);

      const speakerCone = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.68, 0.2, 48, 1, true),
        speakerConeMaterial,
      );
      speakerCone.position.set(0, 0.39, 0);
      scene.add(speakerCone);

      const speakerCap = new THREE.Mesh(
        new THREE.SphereGeometry(0.17, 24, 12),
        speakerBodyMaterial,
      );
      speakerCap.scale.y = 0.45;
      speakerCap.position.set(0, 0.49, 0);
      scene.add(speakerCap);

      const speakerRim = new THREE.Mesh(
        new THREE.TorusGeometry(0.7, 0.045, 12, 48),
        speakerBodyMaterial,
      );
      speakerRim.rotation.x = Math.PI / 2;
      speakerRim.position.set(0, 0.3, 0);
      scene.add(speakerRim);

      function addSpeakerWire(points, color) {
        const path = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => v(x, y, z)));
        const wire = new THREE.Mesh(
          new THREE.TubeGeometry(path, 72, 0.025, 8, false),
          new THREE.MeshStandardMaterial({ color, metalness: 0.2, roughness: 0.55 }),
        );
        scene.add(wire);
      }

      addSpeakerWire(
        [
          [-0.38, 0.24, -0.08],
          [-0.65, 0.07, -0.8],
          [-2.4, 0.06, -2.3],
          [-4.3, 0.06, -4.5],
          [-5.8, 0.06, -6.7],
          [-6, 0.06, -7.35],
          [-6, 0.82, BACK_Z + 0.08],
        ],
        0x55e6ff,
      );
      addSpeakerWire(
        [
          [0.38, 0.24, -0.08],
          [0.65, 0.07, -0.8],
          [2.4, 0.06, -2.3],
          [4.3, 0.06, -4.5],
          [5.8, 0.06, -6.7],
          [6, 0.06, -7.35],
          [6, 0.82, BACK_Z + 0.08],
        ],
        0xffc66d,
      );

      function addWaveDisplay(x, title, reading, color, amplitude) {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 512;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Unable to create a waveform display.");

        context.fillStyle = "#06101a";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = color;
        context.font = "bold 25px monospace";
        context.fillText(title, 32, 54);
        context.font = "bold 34px monospace";
        context.fillText(reading, 32, 112);

        const left = 32, right = 480, top = 155, bottom = 468;
        context.strokeStyle = "rgba(110, 180, 210, 0.2)";
        context.lineWidth = 1;
        for (let gridX = left; gridX <= right; gridX += 56) {
          context.beginPath();
          context.moveTo(gridX, top);
          context.lineTo(gridX, bottom);
          context.stroke();
        }
        for (let gridY = top; gridY <= bottom; gridY += 52) {
          context.beginPath();
          context.moveTo(left, gridY);
          context.lineTo(right, gridY);
          context.stroke();
        }

        context.beginPath();
        for (let i = 0; i <= 160; i++) {
          const progress = i / 160;
          const px = left + progress * (right - left);
          const py = (top + bottom) / 2 - Math.sin(progress * Math.PI * 8) * amplitude;
          if (i === 0) context.moveTo(px, py);
          else context.lineTo(px, py);
        }
        context.strokeStyle = color;
        context.lineWidth = 5;
        context.shadowColor = color;
        context.shadowBlur = 12;
        context.stroke();
        context.shadowBlur = 0;

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const screen = new THREE.Mesh(
          new THREE.PlaneGeometry(1.6, 1.6),
          new THREE.MeshBasicMaterial({ map: texture, toneMapped: false }),
        );
        screen.position.set(x, 1.6, BACK_Z + 0.01);
        scene.add(screen);

        const knobX = x + 1.15;
        const knobPlate = new THREE.Mesh(
          new THREE.BoxGeometry(0.55, 0.7, 0.08),
          speakerBodyMaterial,
        );
        knobPlate.position.set(knobX, 1.6, BACK_Z + 0.05);
        scene.add(knobPlate);

        const knob = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.2, 0.15, 32),
          speakerConeMaterial,
        );
        knob.rotation.x = Math.PI / 2;
        knob.position.set(knobX, 1.6, BACK_Z + 0.16);
        scene.add(knob);

        const indicator = new THREE.Mesh(
          new THREE.BoxGeometry(0.035, 0.12, 0.01),
          new THREE.MeshBasicMaterial({ color }),
        );
        indicator.position.set(knobX, 1.68, BACK_Z + 0.24);
        scene.add(indicator);
      }

      addWaveDisplay(-6, "FREQUENCY", "440 Hz", "#55e6ff", 70);
      addWaveDisplay(6, "AMPLITUDE", "70%", "#ffc66d", 125);

      function applyStoneTexture(baseTex, surfaceType) {
        baseTex.colorSpace = THREE.SRGBColorSpace;
        for (const { material, width, height, type } of stoneSurfaces) {
          if (type !== surfaceType) continue;
          const tex = baseTex.clone();
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          const tileHeight = TILE_W * baseTex.image.height / baseTex.image.width;
          tex.repeat.set(width / TILE_W, height / tileHeight);
          material.map = tex;
          material.color.set(0xffffff);
          material.needsUpdate = true;
        }
      }

      const stoneLoader = new THREE.TextureLoader();
      Promise.all([
        stoneLoader.loadAsync("Stonewall.png"),
        stoneLoader.loadAsync("Stonewalls2.jpg"),
      ])
        .then(([stonewall, stonewalls2]) => {
          applyStoneTexture(stonewall, "floor");
          applyStoneTexture(stonewalls2, "wall");
        })
        .catch((error) => {
          console.error("Unable to load the Sound Shatter stone textures:", error);
        });

      function animate(time) {
        const coneScale = 1 + 0.22 * Math.sin(time * 0.02);
        speakerCone.scale.y = coneScale;
        speakerCone.position.y = 0.29 + 0.1 * coneScale;
        speakerCap.position.y = 0.29 + 0.2 * coneScale;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      window.addEventListener("resize", () => {
        camera.aspect = root.clientWidth / root.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(root.clientWidth, root.clientHeight);
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
