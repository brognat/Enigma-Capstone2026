<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Enigma Escape Room</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <main id="game-root" aria-label="The Enigma Escape Room">
      <header class="site-header">
        <h1>Enigma Escape Rooms</h1>
        <p>A collaborative problem solving experience</p>
        <button id="start-button" class="start-button" type="button">
          Start
        </button>
      </header>
    </main>
    <dialog id="setup-menu" aria-labelledby="setup-heading">
      <form id="setup-form">
        <h2 id="setup-heading">Player setup</h2>
        <p>Enter both players' details and choose an AI mode.</p>
        <div class="player-fields">
          <fieldset>
            <legend>User 1</legend>
            <label for="user-1-id">User ID</label>
            <input id="user-1-id" name="user1Id" type="text" required />
            <label for="user-1-age">Age</label>
            <input
              id="user-1-age"
              name="user1Age"
              type="number"
              min="1"
              step="1"
              required
            />
          </fieldset>
          <fieldset>
            <legend>User 2</legend>
            <label for="user-2-id">User ID</label>
            <input id="user-2-id" name="user2Id" type="text" required />
            <label for="user-2-age">Age</label>
            <input
              id="user-2-age"
              name="user2Age"
              type="number"
              min="1"
              step="1"
              required
            />
          </fieldset>
        </div>
        <fieldset class="ai-options">
          <legend>AI mode</legend>
          <label>
            <input type="radio" name="aiMode" value="full" required />
            Full AI implementation
          </label>
          <label>
            <input type="radio" name="aiMode" value="collaborative" />
            Collaborative A.I.
          </label>
          <label>
            <input type="radio" name="aiMode" value="none" />
            No A.I. implementation
          </label>
        </fieldset>
        <div class="setup-actions">
          <button id="cancel-setup" class="secondary-button" type="button">
            Cancel
          </button>
          <button type="submit">Confirm setup</button>
        </div>
      </form>
    </dialog>
    <script src="playerSetup.js"></script>
    <script src="clickLogger.js"></script>
  </body>
</html>
